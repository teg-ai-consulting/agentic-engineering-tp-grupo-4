<!doctype html>
<meta charset="utf-8" />
<title>Marketplace — Home</title>
<style>
  body { font: 15px system-ui; margin: 2rem; max-width: 720px; }
  .item { border-bottom: 1px solid #ddd; padding: .75rem 0; display: flex; gap: 1rem; }
  .item img { width: 64px; height: 64px; object-fit: cover; background: #eee; border-radius: 6px; }
  .precio { font-weight: 600; }
  .vendedor { color: #666; font-size: 13px; }
  .novedad { background: #16a34a; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
</style>
<h1>Publicaciones</h1>
<div id="lista">cargando…</div>

<script>
const API = "http://localhost:8001";

function pesos(centavos) {
  return "$" + (centavos / 100).toLocaleString("es-AR", { maximumFractionDigits: 0 });
}

async function cargar() {
  const r = await fetch(`${API}/v1/items?limit=20`);
  const { items } = await r.json();
  document.getElementById("lista").innerHTML = items.map(it => `
    <div class="item">
      <img src="${it.foto_url || ""}" alt="" />
      <div>
        <div>${it.titulo}</div>
        <div class="precio">${pesos(it.precio_centavos)}</div>
        <div class="vendedor">${it.vendedor_nombre || "—"}</div>
      </div>
    </div>
  `).join("");
}
cargar();
</script>
