openapi: 3.1.0
info:
  title: compras-service
  version: "0.1 (propuesto — feature 'Mis compras')"
paths:
  /v1/compras:
    get:
      summary: Historial de compras del usuario autenticado
      description: >
        Filtra por el `sub` del JWT (ADR-0005). NO acepta usuario_id del request.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Compra" }
                  next_cursor: { type: [string, "null"] }
        "401": { description: sin token }
    post:
      summary: Confirma una compra
      description: Requiere `Idempotency-Key` (ADR-0003).
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: creada }
        "400": { description: falta Idempotency-Key }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Compra:
      type: object
      required: [id, item_id, item_titulo, precio_centavos, moneda, comprada_en]
      properties:
        id: { type: string }
        item_id: { type: string }
        item_titulo: { type: string, description: "denormalizado" }
        precio_centavos: { type: integer }
        moneda: { type: string, enum: [ARS] }
        comprada_en: { type: string, format: date-time }
